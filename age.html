<h1 style="text-align:center;font-size:60px;color:white;text-shadow: 2px 2px 4px rgba(0,0,0,0.8);">兰州市安宁区幸福食堂数据新闻</h1>
<br>
<h2 style="text-align: center;color:white;text-shadow: 2px 2px 4px rgba(0,0,0,0.8);">一碗热饭，读懂安宁养老民生答卷</h2>
<hr>
<div class="content">
<p1 style="color:white;display:block; font-size:30px;text-shadow: 2px 2px 4px rgba(0,0,0,0.8);">
当前兰州市安宁区养老助餐服务体系尚未形成官方标准化的年龄统计公示机制，现有政府公开报告、民政公示文件及社区服务公告中，均未系统披露全区养老助餐服务对象的平均年龄、年龄段分层占比、高龄与低龄老人就餐分布等量化数据，区域老年助餐受众年龄特征缺乏权威、统一的宏观统计支撑。从服务准入制度层面分析，安宁区幸福食堂及各助餐点位统一以60周岁作为老年助餐服务的基础准入界限，理论上服务受众可覆盖60–69岁低龄老人、70–79岁中龄老人、80周岁及以上高龄老人全年龄段老年群体，服务覆盖跨度广、受众年龄层次多元。
</p1>
