<p1 style="color:white;display:block; font-size:30px;text-shadow: 2px 2px 4px rgba(0,0,0,0.8);">
安宁区养老助餐网络由中心幸福食堂与散布于各社区的助餐点位共同构成，形成普惠型老年助餐供给格局。依据《安宁区 2025 年政府工作报告》，全区养老助餐项目日均服务老年群体 3500 余名，供给形式同时覆盖社区集中堂食与居家上门送餐，兼顾行动尚可老人与失能、不便外出老人的就餐需求。其中，枣林西社区幸福食堂是区内运营相对成熟、具有较强示范效应的典型点位，日常堂食接待规模稳定在每日 100–200 人次，在册登记、可享受助餐服务的老人数量已超过 1000 人，能够在一定程度上反映街道层面助餐服务的受众规模与运行状态。
